name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04 # pinned: Playwright's --with-deps must support the image
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

      - uses: astral-sh/setup-uv@v10.2.0 # exact tags only: no moving @v10 is published
      - name: Python wrapper tests
        working-directory: python
        run: |
          uv sync
          uv run playwright install --with-deps chromium
          uv run pytest -q
