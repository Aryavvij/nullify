<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>attack: window.open bypass</title>
<link rel="stylesheet" href="/common.css">
<script src="/common.js"></script>
</head>
<body>
<h1>Episode 4</h1>
<article id="article"><p>Episode 4 recap: the crew lands on the moon and finds the old relay station still running.</p><p>Comments and next episode below.</p></article>
<script>
  document.addEventListener("click", () => {
    const mode = FIX.mode() || "click";
    if (mode === "form") {
      const f = document.createElement("form");
      f.action = FIX.ad("form"); f.target = "_blank"; f.method = "get";
      document.body.appendChild(f); f.submit();
      return;
    }
    const a = document.createElement("a");
    a.href = FIX.ad(mode); a.target = "_blank";
    if (mode === "dispatch") a.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true }));
    else a.click();
  }, { once: true });
</script>
</body></html>
