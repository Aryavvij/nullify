<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>legit: counter</title>
<link rel="stylesheet" href="/common.css">
<script src="/common.js"></script>
</head>
<body>
<h1>Counter</h1>
<button id="inc">Add one</button>
<p id="count">0</p>
<script>
  const count = document.getElementById("count");
  document.getElementById("inc").onclick = () => { count.textContent = String(Number(count.textContent) + 1); };
</script>
</body></html>
